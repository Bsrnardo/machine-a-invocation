<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La machine a invocation</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montagu+Slab:opsz,wght@16..144,100..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section>
      <h1>La Machine<br />à invocation</h1>

      <form id="invocation">
        <!-- / Mettre le nom d'utilisateur -->
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" />
        <!-- Choisir la creature -->
        <label for="creature">Créature</label>
        <!-- Liste de creatures -->
        <select id="creature" name="creature">
          <option value="chat-octo">🐙 le Chat-Octo</option>
          <option value="dragon-debug">🐉 le Dragon-Debug</option>
          <option value="licorne-css">🦄 la Licorne-CSS</option>
          <option value="renard-refacto">🦊 le Renard-Refacto</option>
        </select>
        <button type="submit">Invoquer</button>
      </form>
      <!-- Zone de résultat -->
      <section id="resultat" class="cache">
        <p id="message"></p>
      </section>
    </section>
  </body>
</html>
